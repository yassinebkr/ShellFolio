name: Verify ShellFolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the virtual shell
        run: npm test
      - name: Validate browser code
        run: |
          node --check app.js
          node --check engine.js
          node --check launch-script.js
          node --check startup.js
          node --check portfolio.config.js
      - name: Reproduce the animated SVG demonstration
        run: |
          python3 tools/make_demo.py
          git diff --exit-code -- assets/demo.svg
      - name: Validate static asset structure
        run: |
          python3 - <<'PY_CHECK'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          ET.parse('assets/demo.svg')
          ET.parse('assets/debian.svg')
          for name in ('index.html', 'style.css', 'app.js', 'engine.js', 'launch-script.js', 'startup.js', 'portfolio.config.js', 'docs/CUSTOMIZATION.md'):
              assert Path(name).is_file(), name
          print('Validated ShellFolio site files')
          PY_CHECK
